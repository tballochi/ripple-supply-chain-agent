name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # No embedding model download in CI: retrieval runs on full-text only,
      # and the store is regenerated from the committed vector cache.
      RIPPLE_NO_EMBEDDINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.5
      - run: python -m ruff check .
      - run: python -m pytest -q
