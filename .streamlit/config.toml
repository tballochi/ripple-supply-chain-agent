# Ripple's look: black and white, one green for what to do about it.
[theme]
base = "dark"
primaryColor = "#3BD671"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0E0E0E"
textColor = "#F2F2F2"
linkColor = "#F2F2F2"
borderColor = "#262626"
baseRadius = "0.375rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#0E0E0E"
borderColor = "#1C1C1C"

[browser]
gatherUsageStats = false
